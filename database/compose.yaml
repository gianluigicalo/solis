services:
  database:
    # PostgreSQL 17 con TimescaleDB
    image: timescale/timescaledb:2.17.2-pg17
    container_name: solis-database
    restart: unless-stopped
    ports:
      # solo da questa macchina, IPv4 e IPv6 (BIND_ADDRESS=0.0.0.0 e BIND_ADDRESS6=[::] per esporre in
      # rete); porta 15432 per non scontrarsi con un PostgreSQL locale sulla 5432
      - "${BIND_ADDRESS:-127.0.0.1}:${DATABASE_PORT:-15432}:5432"
      - "${BIND_ADDRESS6:-[::1]}:${DATABASE_PORT:-15432}:5432"
    environment:
      TZ: Europe/Rome
      POSTGRES_DB: ${POSTGRES_DB:-solis}
      POSTGRES_USER: ${POSTGRES_USER:-solis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solis}
    volumes:
      # Dati persistenti: restano dopo riavvii, "docker compose down" e ricostruzioni delle immagini
      # (PGDATA dell'immagine = /var/lib/postgresql/data)
      - database-data:/var/lib/postgresql/data
      # Montati come singoli file per non nascondere gli script di installazione dell'immagine (000_*, 001_*)
      - ./init/010-schema.sql:/docker-entrypoint-initdb.d/010-schema.sql:ro
      - ./init/020-timescale.sql:/docker-entrypoint-initdb.d/020-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  database-data:
    # Nome fisso: lo stesso volume sia avviando dalla cartella principale sia da database/
    # (senza, Docker antepone il nome del progetto e creerebbe due database distinti)
    name: solis-database-data
