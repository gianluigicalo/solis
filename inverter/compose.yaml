services:
  inverter:
    build: .
    image: solis-inverter:latest
    container_name: solis-inverter
    restart: unless-stopped
    ports:
      # solo da questa macchina, IPv4 e IPv6 (BIND_ADDRESS=0.0.0.0 e BIND_ADDRESS6=[::] per esporre in rete)
      - "${BIND_ADDRESS:-127.0.0.1}:${INVERTER_HTTP_PORT:-10080}:8080"
      - "${BIND_ADDRESS6:-[::1]}:${INVERTER_HTTP_PORT:-10080}:8080"
    environment:
      TZ: Europe/Rome
      # Sovrascrivono i valori di application.yml (binding "relaxed" di Spring Boot)
      SOLIS_HOST: ${SOLIS_HOST:-192.168.1.84}
      SOLIS_PORT: ${SOLIS_PORT:-502}
      SOLIS_UNIT_ID: ${SOLIS_UNIT_ID:-1}
      SOLIS_TIMEOUT: ${SOLIS_TIMEOUT:-5s}
      SOLIS_CACHE_TTL: ${SOLIS_CACHE_TTL:-5s}
